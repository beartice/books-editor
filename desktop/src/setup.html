<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Books Editor</title>
  <style>
    body { font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 36px 36px 28px; color: #1d1d1f; background: #f5f5f7; }
    main { max-width: 470px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #555; line-height: 1.45; margin: 0 0 12px; }
    .choice { display: block; border: 1.5px solid #c9c9ce; border-radius: 10px; background: #fff; padding: 12px 14px; margin-top: 12px; cursor: pointer; }
    .choice.selected { border-color: #0a6cf0; box-shadow: 0 0 0 3px rgba(10, 108, 240, .12); }
    .choice input[type=radio] { margin-right: 8px; }
    .choice strong { font-size: 15px; }
    .tag { font-size: 11px; color: #0a6cf0; margin-left: 6px; font-weight: 600; }
    .choice .hint { margin: 4px 0 0 24px; font-size: 13px; }
    .detail { margin: 10px 0 0 24px; }
    .detail[hidden] { display: none; }
    label.field { display: block; margin: 0 0 4px; font-weight: 600; font-size: 13px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 13px; border: 1px solid #c9c9ce; border-radius: 8px; }
    .folder { display: flex; gap: 8px; }
    .row { display: flex; gap: 8px; margin-top: 18px; }
    button { padding: 8px 16px; font-size: 14px; border-radius: 8px; border: 1px solid #c9c9ce; background: #fff; }
    button.primary { background: #0a6cf0; color: #fff; border-color: #0a6cf0; }
    button:disabled { opacity: .6; }
    #msg { margin-top: 12px; min-height: 20px; color: #c0262d; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Books Editor</h1>
    <p>Come vuoi usare la libreria? Si sceglie una volta sola e si cambia dal menu «Books Editor → Cambia modalità…».</p>
    <form id="form">
      <label class="choice selected" id="choice-local">
        <input type="radio" name="mode" value="local" checked>
        <strong>Su questo computer</strong><span class="tag">consigliata</span>
        <p class="hint">I libri stanno in una cartella del computer e non serve nessun server né connessione.</p>
        <div class="detail" id="detail-local">
          <label class="field" for="folder">Cartella della libreria</label>
          <div class="folder">
            <input id="folder" type="text" autocomplete="off" spellcheck="false">
            <button id="pick" type="button">Scegli…</button>
          </div>
        </div>
      </label>
      <label class="choice" id="choice-server">
        <input type="radio" name="mode" value="server">
        <strong>Collegati a un server</strong>
        <p class="hint">Apri la libreria di un server Books Editor, tuo o di casa.</p>
        <div class="detail" id="detail-server" hidden>
          <label class="field" for="url">Indirizzo del server</label>
          <input id="url" type="text" placeholder="https://esempio.it" autocomplete="off" spellcheck="false">
        </div>
      </label>
      <div class="row">
        <button class="primary" id="go" type="submit">Continua</button>
        <button id="cancel" type="button" hidden>Annulla</button>
      </div>
      <div id="msg" role="alert"></div>
    </form>
  </main>
  <script src="setup.js"></script>
</body>
</html>
