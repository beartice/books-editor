<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Books Editor</title>
  <style>
    body { font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 44px 36px; color: #1d1d1f; background: #f5f5f7; }
    main { max-width: 440px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #555; line-height: 1.45; margin: 0 0 12px; }
    pre { background: #fff; border: 1px solid #d8d8dc; border-radius: 8px; padding: 10px; font-size: 12px; max-height: 150px; overflow: auto; white-space: pre-wrap; color: #7a1f24; }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    button { padding: 8px 16px; font-size: 14px; border-radius: 8px; border: 1px solid #c9c9ce; background: #fff; }
    button.primary { background: #0a6cf0; color: #fff; border-color: #0a6cf0; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="text"></p>
    <pre id="detail" hidden></pre>
    <div class="row" id="actions" hidden>
      <button class="primary" id="restart" type="button">Riavvia</button>
      <button id="change" type="button">Cambia modalità…</button>
    </div>
  </main>
  <script src="status.js"></script>
</body>
</html>
