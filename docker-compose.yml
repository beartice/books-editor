services:
  libreria:
    build: .
    image: books-editor:latest
    container_name: libreria
    restart: unless-stopped
    ports:
      # BIND_ADDRESS: indirizzo su cui ascolta l'app. Il default (solo host)
      # va bene con nginx sulla stessa macchina; se il reverse proxy sta su
      # un'altra macchina metti l'IP LAN del server (vedi deploy/nginx).
      - "${BIND_ADDRESS:-127.0.0.1}:8787:8787"
    # Irrigidimento del container: file system in sola lettura, nessun
    # privilegio, nessuna capability. L'app scrive solo nei volumi e in /tmp.
    read_only: true
    tmpfs:
      # /tmp e' in RAM (conta nel limite di memoria): ci stanno solo cache e
      # configurazione di Calibre e i file temporanei di fontconfig/canvas.
      # I file delle conversioni stanno su disco, in .uploads nella libreria.
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Limite di memoria: l'import EFP e la lettura degli EPUB grandi possono
    # essere pesanti (un EPUB da 120 MB arriva a circa 420 MB). 2 GB bastano per
    # file fino a MAX_UPLOAD_MB=300 ed evitano che un picco saturi il server.
    # La conversione con Calibre (MOBI, AZW3, FB2, DJVU) usa molta memoria: per
    # file molto grandi alza MEM_LIMIT. Si converte un file alla volta.
    mem_limit: ${MEM_LIMIT:-2g}
    environment:
      NODE_ENV: production
      # nginx sull'host raggiunge il container dal gateway della rete bridge
      # (rete privata): serve uniquelocal oltre a loopback. Con un proxy su
      # un'altra macchina metti il suo IP (non uniquelocal: qualunque
      # dispositivo della LAN potrebbe falsificare X-Forwarded-For).
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      # Autenticazione: i valori stanno in .env (vedi .env.example per i `$`).
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS_HASH: ${AUTH_PASS_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # Cartelle consentite per «Importa da percorso» (vuoto = disattivato).
      IMPORT_ROOTS: ${IMPORT_ROOTS:-}
      # L'app e' same-origin: lascia vuoto.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Chiave opzionale per Google Books (rimuove il limite di richieste).
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      # Dimensione massima di un file caricato dal browser (MB).
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Tempo massimo di una conversione di formato, in secondi (default 600).
      CONVERT_TIMEOUT_SEC: ${CONVERT_TIMEOUT_SEC:-600}
      # Fuso orario del container: il controllo notturno dei nuovi capitoli delle
      # fanfiction parte all'ora locale (FANFIC_CHECK_HOUR). Senza TZ sarebbe UTC.
      TZ: ${TZ:-Europe/Rome}
      # Controllo automatico dei nuovi capitoli (AO3, EFP): "off" lo disattiva;
      # parte ogni giorno all'ora indicata, con una pausa fra una richiesta e l'altra.
      FANFIC_CHECK: ${FANFIC_CHECK:-on}
      FANFIC_CHECK_HOUR: ${FANFIC_CHECK_HOUR:-3}
      FANFIC_CHECK_DELAY_SEC: ${FANFIC_CHECK_DELAY_SEC:-6}
      # Jellyfin legge la cartella delle librerie: serve a abbinare i suoi file alle
      # schede quando vede la cartella con un percorso diverso da quello del container
      # (vedi .env.example). Vuota = percorsi uguali. SYNC_MINUTES: ogni quanti minuti
      # abbina i nuovi elementi e invia le schede modificate (0 = giro periodico spento).
      JELLYFIN_PATH_MAP: ${JELLYFIN_PATH_MAP:-}
      JELLYFIN_SYNC_MINUTES: ${JELLYFIN_SYNC_MINUTES:-30}
    volumes:
      # La libreria (epub, copertine, book.json) vive qui. LIBRARY_PATH la
      # sposta, ad esempio su un disco dedicato.
      - "${LIBRARY_PATH:-./library}:/app/library"
      # Le librerie aggiuntive (sezioni separate dello stesso account), una
      # sottocartella ciascuna. LIBRARIES_PATH le sposta. Deve stare fuori da
      # LIBRARY_PATH e da DATA_PATH.
      - "${LIBRARIES_PATH:-./librerie}:/app/libraries"
      # Indice e impostazioni. DATA_PATH la sposta.
      - "${DATA_PATH:-./data}:/app/data"
      # Facoltativo: cartella da cui «Importa da percorso». Se la attivi,
      # imposta anche IMPORT_ROOTS=/import nel .env.
      # - ./import:/import:ro
