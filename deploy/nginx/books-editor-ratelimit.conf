# Zone dei limiti di frequenza per books-editor.
# Va copiato in /etc/nginx/conf.d/ (e' incluso nel contesto http).
# Compatibile con nginx 1.22; usato da books-editor.conf.example.
# Chiave: indirizzo IP del client (binary_remote_addr).

# Login: severo, contro la forza bruta (10 richieste al minuto).
limit_req_zone $binary_remote_addr zone=books_login:10m rate=10r/m;

# API in generale: largo, protegge solo dagli abusi evidenti.
limit_req_zone $binary_remote_addr zone=books_api:10m rate=20r/s;

# Copertine: la griglia ne chiede centinaia insieme all'apertura.
# Sono solo letture di immagini, gia' protette dal login dell'app.
limit_req_zone $binary_remote_addr zone=books_covers:10m rate=200r/s;
